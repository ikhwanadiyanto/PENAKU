    // FUNGSI INDEXEDDB REAL-TIME DARI PENA MANTAP V6
    function bukaIndexedDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open("AplikasiKelasVIDB", 1);
            request.onerror = e => reject(e.target.error);
            request.onsuccess = e => resolve(e.target.result);
            request.onupgradeneeded = e => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('pengaturan')) db.createObjectStore('pengaturan');
            };
        });
    }

    async function muatDataRealtimeDariIndexedDB() {
        try {
            const db = await bukaIndexedDB();
            const tx = db.transaction('pengaturan', 'readonly');
            const store = tx.objectStore('pengaturan');
            
            const masterSiswa = await new Promise((resolve) => {
                const req = store.get('dbMasterSiswa');
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = () => resolve(null);
            });

            if (masterSiswa && Array.isArray(masterSiswa)) {
                SISWA = masterSiswa;
            } else {
                SISWA = JSON.parse(localStorage.getItem('dbMasterSiswa')) || MASTER_SISWA_DEFAULT;
            }

            const fotoSiswaDB = await new Promise((resolve) => {
                const req = store.get('dbDataSiswa');
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = () => resolve(null);
            });

            if (fotoSiswaDB) {
                databaseFotoSiswa = fotoSiswaDB;
            } else {
                databaseFotoSiswa = JSON.parse(localStorage.getItem('dbFotoSiswa')) || {};
            }

            perbaruiBarMemoriIndexedDB(db);
        } catch (err) {
            console.error("Gagal memuat IndexedDB secara real-time, fallback ke localStorage:", err);
            SISWA = JSON.parse(localStorage.getItem('dbMasterSiswa')) || MASTER_SISWA_DEFAULT;
            perbaruiBarMemoriFallback();
        }
    }

    async function perbaruiBarMemoriIndexedDB(db) {
        try {
            let estimatedBytes = 0;
            if (navigator.storage && navigator.storage.estimate) {
                const estimate = await navigator.storage.estimate();
                estimatedBytes = estimate.usage || 0;
            }
            
            const kb = (estimatedBytes / 1024).toFixed(1);
            const limitMb = 50; 
            const maxBytes = limitMb * 1024 * 1024;
            const pct = Math.min(100, ((estimatedBytes / maxBytes) * 100)).toFixed(1);

            document.getElementById('memoryStatusText').innerHTML = `<i class="fa-solid fa-database" style="color:#0284c7;"></i> IndexedDB Aktif (PENA MANTAP V6): <b>${kb} KB</b>`;
            document.getElementById('memoryProgressFill').style.width = `${pct}%`;
            document.getElementById('memoryPercentText').innerText = `${pct}%`;
        } catch(e) {
            perbaruiBarMemoriFallback();
        }
    }

    function perbaruiBarMemoriFallback() {
        let totalBytes = 0;
        for (let key in localStorage) {
            if (localStorage.hasOwnProperty(key)) totalBytes += ((localStorage[key].length + key.length) * 2);
        }
        const kb = (totalBytes / 1024).toFixed(1);
        const pct = Math.min(100, ((kb / 51200) * 100)).toFixed(1);

        document.getElementById('memoryStatusText').innerHTML = `<i class="fa-solid fa-database" style="color:#f59e0b;"></i> Penyimpanan Lokal: <b>${kb} KB</b>`;
        document.getElementById('memoryProgressFill').style.width = `${pct}%`;
        document.getElementById('memoryPercentText').innerText = `${pct}%`;
    }

    function getConfigSemesterAktif() {
        const sem = document.getElementById('semesterSelect').value;
        if(!configBabLagu[sem]) {
            configBabLagu[sem] = [
                { bab: "Bab 1", lagu: "" },
                { bab: "Bab 2", lagu: "" },
                { bab: "Bab 3", lagu: "" },
                { bab: "Bab 4", lagu: "" }
            ];
        }
        return configBabLagu[sem];
    }

    function renderSelectBabManager() {
        const listBab = getConfigSemesterAktif();
        const select = document.getElementById('selectBabEdit');
        select.innerHTML = '';
        listBab.forEach((b, idx) => {
            select.innerHTML += `<option value="${idx}">${b.bab}</option>`;
        });
        gantiBabPengaturan();
    }

    function gantiBabPengaturan() {
        const listBab = getConfigSemesterAktif();
        const idx = document.getElementById('selectBabEdit').value;
        if(listBab[idx]) {
            document.getElementById('inputJudulLagu').value = listBab[idx].lagu || '';

    function updateJudulLaguBab() {

        const listBab = getConfigSemesterAktif();
        const idx = document.getElementById('selectBabEdit').value;
        const judul = document.getElementById('inputJudulLagu').value;

        if(listBab[idx]) {
            listBab[idx].lagu = judul;
            configBabLagu[sem] = listBab;

    function tambahBabBaru() {
        const sem = document.getElementById('semesterSelect').value;
        const listBab = getConfigSemesterAktif();
        const nextNum = listBab.length + 1;
        listBab.push({ bab: `Bab ${nextNum}`, lagu: "" });

        localStorage.setItem('dbConfigBabLaguNyanyi', JSON.stringify(configBabLagu));
        
        renderSelectBabManager();
        document.getElementById('selectBabEdit').value = listBab.length - 1;

    function hapusBabTerakhir() {
        const sem = document.getElementById('semesterSelect').value;
        const listBab = getConfigSemesterAktif();
        if(listBab.length <= 1) {
            alert('Minimal harus tersisa 1 Bab!');
            return;
        }
        if(confirm(`Yakin ingin menghapus ${listBab[listBab.length-1].bab}? Nilai pada bab ini akan hilang.`)) {
            listBab.pop();
            configBabLagu[sem] = listBab;
            localStorage.setItem('dbConfigBabLaguNyanyi', JSON.stringify(configBabLagu));
            
            renderSelectBabManager();
            inisialisasiTabel();
        }
    }

    function simpanKKM() {
        const kkmVal = document.getElementById('kkmInput').value;

            localStorage.setItem('dbKKMNyanyi', kkmVal);
            perbaruiSemuaWarnaKKM();
            alert('KKM (' + kkmVal + ') tersimpan!');
        }
    }

    function muatKKMTersimpan() {
        const kkmLokal = localStorage.getItem('dbKKMNyanyi');
        if (kkmLokal) { document.getElementById('kkmInput').value = kkmLokal; }
    }

    function prosesUnggahLogo(input) {
        if (input.files && input.files[0]) {

            pembacaFile.onload = function(e) {
                const hasilBase64 = e.target.result;

    function muatLogoTersimpan() {
        const logoLokal = localStorage.getItem('dbLogoNyanyi');
        if (logoLokal) { document.getElementById('tampilanLogo').src = logoLokal; }

    function inisialisasiTabel() {
        const semAktif = document.getElementById('semesterSelect').value;
        const listBab = getConfigSemesterAktif();
        const headerTable = document.getElementById('headerTable');

        let trBaris1 = `<tr><th class="th-utama" rowspan="2">No</th><th class="th-utama" rowspan="2">NIS</th><th class="th-utama col-nama" rowspan="2">Nama Siswa</th>`;
        let trBaris2 = `<tr>`;

        listBab.forEach((b, bIdx) => {
            const txtLagu = b.lagu ? `(Lagu: ${b.lagu})` : '';
            trBaris1 += `<th class="th-bab-header" colspan="${ASPEK_PENILAIAN.length}">${b.bab} <span id="headerLaguBab_${bIdx}">${txtLagu}</span></th>`;
            ASPEK_PENILAIAN.forEach(asp => {
                trBaris2 += `<th class="th-aspek">${asp}</th>`;
            });
        });

        trBaris1 += `<th class="th-raport" rowspan="2">NILAI AKHIR</th></tr>`;
        trBaris2 += `</tr>`;

        headerTable.innerHTML = trBaris1 + trBaris2;

        const body = document.getElementById('bodyNilaiNyanyi');
        body.innerHTML = '';

        if(!databaseNilai[semAktif]) { databaseNilai[semAktif] = {}; }

        SISWA.forEach((siswa, index) => {
            const nis = siswa[0];
            const nama = siswa.length >= 3 ? siswa[2] : siswa[1];
            const dataSiswa = databaseNilai[semAktif][nis] || { babData: {}, raport: '0' };

            let htmlKolomNilai = '';

            listBab.forEach((b, bIdx) => {
                const arrNilaiBab = (dataSiswa.babData && dataSiswa.babData[bIdx]) ? dataSiswa.babData[bIdx] : Array(ASPEK_PENILAIAN.length).fill('');
                ASPEK_PENILAIAN.forEach((asp, aIdx) => {
                    const val = arrNilaiBab[aIdx] !== undefined ? arrNilaiBab[aIdx] : '';
                    htmlKolomNilai += `<td><input type="number" class="input-nilai asp" data-bab="${bIdx}" data-aspek="${aIdx}" min="0" max="100" value="${val}" oninput="hitungOtomatisRaport(this)"></td>`;
                });
            });

            const nilaiAkhirTeks = dataSiswa.raport || 0;

            body.innerHTML += `
                <tr data-nis="${nis}">
                    <td class="col-no">${index + 1}</td>
                    <td class="col-nis">${nis}</td>
                    <td class="col-nama">
                        <div class="nama-container">
                            <span class="nama-teks">${nama}</span>
                            <span class="area-badge"></span>
                        </div>
                    </td>
                    ${htmlKolomNilai}
                    <td><b class="nilai-raport">${nilaiAkhirTeks}</b></td>
                </tr>
            `;
        });

        perbaruiSemuaWarnaKKM();
        evaluasiIndikatorSiswa();
        isiOpsiModalBab();
    }

    function hitungOtomatisRaport(element) {
        const baris = element.closest('tr');
        const nis = baris.getAttribute('data-nis');
        const semAktif = document.getElementById('semesterSelect').value;
        const listBab = getConfigSemesterAktif();
        
        let babData = {};
        let totalSeluruh = 0, jumlahTerisi = 0;

        listBab.forEach((b, bIdx) => {
            babData[bIdx] = [];
            const inputs = baris.querySelectorAll(`.asp[data-bab="${bIdx}"]`);
            inputs.forEach(inp => {
                const val = inp.value;
                babData[bIdx].push(val);
                if(val !== '') {
                    totalSeluruh += parseFloat(val);
                    jumlahTerisi++;
                }
            });
        });

        let hasilAkhir = jumlahTerisi > 0 ? Math.round(totalSeluruh / jumlahTerisi) : 0;

        baris.querySelector('.nilai-raport').innerText = hasilAkhir;
        warnaiElemenBerdasarkanIsi(baris);

        databaseNilai[semAktif][nis] = {
            babData: babData,
            raport: hasilAkhir
        };
        localStorage.setItem('dbNilaiKokurikulerNyanyiMulti', JSON.stringify(databaseNilai));

        evaluasiIndikatorSiswa();
    }

    function evaluasiIndikatorSiswa() {
        const semuaBaris = document.querySelectorAll('#bodyNilaiNyanyi tr');
        const nilaiKKM = parseFloat(document.getElementById('kkmInput').value) || 0;
        
        let nilaiTertinggi = 0;
        semuaBaris.forEach(baris => {
            const areaBadge = baris.querySelector('.area-badge');
            if(areaBadge) areaBadge.innerHTML = ''; 
            const nr = parseFloat(baris.querySelector('.nilai-raport').innerText) || 0;
            if(nr > nilaiTertinggi) { nilaiTertinggi = nr; }
        });

        semuaBaris.forEach(baris => {
            const areaBadge = baris.querySelector('.area-badge');
            if(!areaBadge) return;

            const nr = parseFloat(baris.querySelector('.nilai-raport').innerText) || 0;
            let adaDiBawahKKM = false;
            
            baris.querySelectorAll('.asp').forEach(inp => {
                if(inp.value !== '' && parseFloat(inp.value) < nilaiKKM) {
                    adaDiBawahKKM = true;
                }
            });

            let htmlBadge = '';
            if(adaDiBawahKKM) {
                htmlBadge += `<i class="fa-solid fa-triangle-exclamation badge-peringatan" title="Ada komponen nilai di bawah KKM!"></i>`;
            }
            if(nr === nilaiTertinggi && nilaiTertinggi >= nilaiKKM && nilaiTertinggi > 0) {
                htmlBadge += `<i class="fa-solid fa-star badge-bintang" title="Nilai Tertinggi: ${nilaiTertinggi}"></i>`;
            }
            areaBadge.innerHTML = htmlBadge;
        });
    }

    function warnaiElemenBerdasarkanIsi(baris) {
        const nilaiKKM = parseFloat(document.getElementById('kkmInput').value) || 0;
        
        baris.querySelectorAll('.input-nilai').forEach(input => {
            input.classList.remove('lulus-kkm', 'gagal-kkm');
            if (input.value !== '') {
                const nilai = parseFloat(input.value) || 0;
                if (nilai >= nilaiKKM) { input.classList.add('lulus-kkm'); } 
                else { input.classList.add('gagal-kkm'); }
            }
        });

        const kotakRaport = baris.querySelector('.nilai-raport');
        if (kotakRaport) {
            const nilaiRaport = parseFloat(kotakRaport.innerText) || 0;
            kotakRaport.classList.remove('lulus-kkm', 'gagal-kkm');
            if (nilaiRaport >= nilaiKKM) { kotakRaport.classList.add('lulus-kkm'); } 
            else { kotakRaport.classList.add('gagal-kkm'); }
        }
    }

    function perbaruiSemuaWarnaKKM() {
        document.querySelectorAll('#bodyNilaiNyanyi tr').forEach(baris => {
            warnaiElemenBerdasarkanIsi(baris);
        });
        evaluasiIndikatorSiswa();
    }

        listBab.forEach((b, idx) => {

    function isiOpsiModalKolom() {

        ASPEK_PENILAIAN.forEach((aspek, idx) => {

        document.getElementById('modalInputNilai').classList.add('active');
        muatNilaiSiswaModal();
    }

    function tutupModalInput() {
        document.getElementById('modalInputNilai').classList.remove('active');
    }

    function muatNilaiSiswaModal() {
        if(SISWA.length === 0) return;
        const siswa = SISWA[indeksSiswaModal];
        const nis = siswa[0];
        const nama = siswa.length >= 3 ? siswa[2] : siswa[1];

        document.getElementById('modalSiswaNis').innerText = `NIS: ${nis}`;
        document.getElementById('modalSiswaNama').innerText = nama;

        const babIdx = document.getElementById('selectTargetBabModal').value;
        const aspIdx = document.getElementById('selectTargetKolom').value;
        
        const inputAsli = document.querySelector(`#bodyNilaiNyanyi tr[data-nis="${nis}"] .asp[data-bab="${babIdx}"][data-aspek="${aspIdx}"]`);

        const inputBig = document.getElementById('inputBigNilai');
        inputBig.value = inputAsli ? inputAsli.value : '';
        setTimeout(() => { inputBig.focus(); inputBig.select(); }, 100);
    }

    function simpanNilaiDariModal() {
        if(SISWA.length === 0) return;
        const nis = SISWA[indeksSiswaModal][0];
        const babIdx = document.getElementById('selectTargetBabModal').value;
        const aspIdx = document.getElementById('selectTargetKolom').value;
        const valBaru = document.getElementById('inputBigNilai').value;

        const inputAsli = document.querySelector(`#bodyNilaiNyanyi tr[data-nis="${nis}"] .asp[data-bab="${babIdx}"][data-aspek="${aspIdx}"]`);

        if(inputAsli) {
            inputAsli.value = valBaru;
            hitungOtomatisRaport(inputAsli);
        }
    }

    function navigasiSiswaModal(direction) {
        simpanNilaiDariModal();
        indeksSiswaModal += direction;

        if (indeksSiswaModal < 0) {
            indeksSiswaModal = SISWA.length - 1;
        } else if (indeksSiswaModal >= SISWA.length) {
            indeksSiswaModal = 0;
        }

        muatNilaiSiswaModal();
    }

    function handleEnterBigInput(e) {
        if(e.key === 'Enter') {
            e.preventDefault();
            navigasiSiswaModal(1);
        }
    }

    function cetakLaporanPDF() {
        const semAktif = document.getElementById('semesterSelect').value;
        const listBab = getConfigSemesterAktif();
        const kkmVal = document.getElementById('kkmInput').value || '75';
        const containerCetak = document.getElementById('areaCetakRapi');

        containerCetak.innerHTML = '';

                <div class="halaman-bab">

                        <h2>LAPORAN PENILAIAN KOKURIKULER VOKAL</h2>

                    </div>

                    <div class="sub-info-bab">
                        <span><b>PENILAIAN:</b> ${b.bab.toUpperCase()}</span>
                        <span><b>JUDUL LAGU:</b> ${b.lagu || '-'}</span>
                        <span><b>KKM:</b> ${kkmVal}</span>
                    </div>

                    <table class="tabel-cetak">
                        <thead>
                            <tr>
                                <th style="width: 30px;">No</th>
                                <th style="width: 65px;">NIS</th>
                                <th class="td-nama">Nama Siswa</th>
            `;

            ASPEK_PENILAIAN.forEach(asp => {
                htmlBab += `<th>${asp}</th>`;
            });

            htmlBab += `
                                <th style="width: 70px;">Rata-Rata</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            SISWA.forEach((siswa, sIdx) => {
                const nis = siswa[0];
                const nama = siswa.length >= 3 ? siswa[2] : siswa[1];
                let totalBab = 0, countBab = 0;
                let htmlAspekTd = '';

                ASPEK_PENILAIAN.forEach((asp, aIdx) => {
                    const inp = document.querySelector(`#bodyNilaiNyanyi tr[data-nis="${nis}"] .asp[data-bab="${bIdx}"][data-aspek="${aIdx}"]`);

    function gantiSemester() { 
        renderSelectBabManager();
        inisialisasiTabel(); 
    }

    function kembaliKeAbsensi() {
        if (window.opener && !window.opener.closed) { window.close(); } 
        else { window.location.href = 'PENA MANTAP V6.html'; }
    }

    function eksporExcel() {
        const semAktif = document.getElementById('semesterSelect').value;
        const workbook = XLSX.utils.table_to_book(document.getElementById('tabelNilaiNyanyi'), { raw: true });
        XLSX.writeFile(workbook, `Kokurikuler_Nyanyi_${semAktif.replace(' ', '')}.xlsx`);
    }

    function simpanKeSheets() {
        const semAktif = document.getElementById('semesterSelect').value;
        const listBab = getConfigSemesterAktif();
        const dataPaket = [];

        document.querySelectorAll('#bodyNilaiNyanyi tr').forEach(baris => {
            let babDataSiswa = {};
            listBab.forEach((b, bIdx) => {
                babDataSiswa[b.bab] = Array.from(baris.querySelectorAll(`.asp[data-bab="${bIdx}"]`)).map(i => i.value || "");
            });

            dataPaket.push({
                nis: baris.getAttribute('data-nis'),
                nama: baris.querySelector('.col-nama .nama-teks').innerText,
                detailBab: babDataSiswa,
                raport: baris.querySelector('.nilai-raport').innerText
            });
        });

        if(!confirm(`Kirim & Simpan data Penilaian Kokurikuler Vokal [ ${semAktif} ] ke Google Sheets?`)) return;

        const btn = document.querySelector('.btn-save');
        btn.innerHTML = "⏳ Simpan..."; btn.disabled = true;

        const dataForm = new URLSearchParams();
        dataForm.append("postData", JSON.stringify({ 
            data: dataPaket, 
            semester: semAktif, 
            configBab: listBab,
            mapel: "Kokurikuler Nyanyi" 
        }));

        fetch(URL_APPS_SCRIPT, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: dataForm
        })
        .then(response => {
            if (!response.ok) throw new Error('Network error');
            alert(`Data Penilaian Kokurikuler (${semAktif}) sukses disimpan ke Google Sheets!`);
        })
        .catch(() => { 
            alert("Proses pengiriman selesai! Silakan periksa spreadsheet Anda."); 
        })
        .finally(() => {
            btn.innerHTML = "<i class='fa-solid fa-cloud-arrow-up'></i> Sheets";
            btn.disabled = false;
        });
    }

    window.onload = async function() {
        muatKKMTersimpan();
        muatLogoTersimpan();
        await muatDataRealtimeDariIndexedDB();
        renderSelectBabManager();
        inisialisasiTabel();
    };
